<!doctype html><html><body style="margin:0;background:#20242b"><script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
const view = new URLSearchParams(location.search).get('view') || 'iso';
const W=1600,H=1200; const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
r.setSize(W,H); r.toneMapping=THREE.ACESFilmicToneMapping; r.outputColorSpace=THREE.SRGBColorSpace; document.body.appendChild(r.domElement);
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x20242b);
scene.environment=new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(),0.04).texture;
const key=new THREE.DirectionalLight(0xffffff,2.2); key.position.set(-40,80,60); scene.add(key);
new GLTFLoader().load('board.glb',g=>{const m=g.scene; scene.add(m);
 // KiCad GLB materials, matched by their export colour (indices shift with export options)
 const near=(c,r,g,b)=>Math.abs(c.r-r)<0.02&&Math.abs(c.g-g)<0.02&&Math.abs(c.b-b)<0.02;
 m.traverse(o=>{if(!o.isMesh)return; const mt=o.material, c=mt.color;
  if(near(c,0.08,0.20,0.14)){c.setHex(0x0f3d24);mt.opacity=0.92;mt.roughness=0.45;}           // soldermask
  else if(near(c,0.5,0.5,0.5)){c.setHex(0xd4a93a);mt.metalness=1.0;mt.roughness=0.25;}        // exposed pads
  else if(near(c,0.7,0.61,0)){c.setHex(0x8a6a2a);mt.metalness=0.6;mt.roughness=0.4;}          // copper tracks
  else if(near(c,0.42,0.45,0.29)){c.setHex(0x2c3a22);}                                         // board body
  else if(near(c,1,1,1)&&mt.transparent){c.setHex(0xf2f2f2);mt.opacity=1;}});                // silkscreen
 const box=new THREE.Box3().setFromObject(m), c=box.getCenter(new THREE.Vector3()), s=box.getSize(new THREE.Vector3());
 m.position.sub(c); const d=Math.max(s.x,s.y,s.z);
 const cam=new THREE.PerspectiveCamera(30,W/H,d/100,d*20);
 // KiCad GLB: Y up = board normal
 if(view==='top'){cam.position.set(0,d*2.2,0.001);} else {cam.position.set(-d*0.75,d*1.15,d*1.25);}
 cam.lookAt(0,0,0); r.render(scene,cam); window.__done=true;});
</script></body></html>
